name: android

# Builds the React Native (Expo) Android app on every push that touches the
# app, uploads the APK as a workflow artifact, and attaches it to a GitHub
# release when a tag is pushed.
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME is
      # preset); the release build only needs the SDK plus the build tools it
      # pins, so no extra SDK setup step is required.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align native versions with the Expo SDK
        run: npx expo install --fix

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK (JS bundled, debug-signed for testing)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mott-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mott-apk-${{ github.ref_name }}
          path: dist/*.apk

      - name: Publish to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rn') }}
